# --- /etc/apache2/sites-available/asf-api.nanjarbudiman.com.conf ---
<VirtualHost *:80>
    ServerName asf-api.nanjarbudiman.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:4000/
    ProxyPassReverse / http://127.0.0.1:4000/

    ErrorLog ${APACHE_LOG_DIR}/asf-api-error.log
    CustomLog ${APACHE_LOG_DIR}/asf-api-access.log combined
</VirtualHost>

# --- /etc/apache2/sites-available/asf.nanjarbudiman.com.conf ---
<VirtualHost *:80>
    ServerName asf.nanjarbudiman.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/asf-frontend-error.log
    CustomLog ${APACHE_LOG_DIR}/asf-frontend-access.log combined
</VirtualHost>

# Certbot will rewrite both to add the :443 blocks + redirect after you run:
#   sudo a2ensite asf-api.nanjarbudiman.com asf.nanjarbudiman.com
#   sudo systemctl reload apache2
#   sudo certbot --apache -d asf-api.nanjarbudiman.com -d asf.nanjarbudiman.com
