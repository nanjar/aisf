version: "3.8"

# Reuses the existing PostgreSQL instance on the Tailscale mesh (e.g. "kuring")
# — no db service defined here. Make sure DATABASE_URL in backend/.env points
# to it (Tailscale hostname, not a public IP), and that this host is allowed
# in Tailscale ACLs to reach the DB port.
#
# V1.2: object storage (§10 PRD V1.2) points at Biznet Gio NEO Object Storage
# (S3-compatible) via STORAGE_* env vars in backend/.env — no local MinIO
# service needed. See backend/src/storage/storage.service.ts.

services:
  backend:
    build:
      context: ./backend
    container_name: asf-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # V1.2: needs a docker socket to spin up ephemeral sandbox containers
    # for validation (§11.3 PRD V1.2) — npm install/tsc/build/psql never run
    # in this container itself, only in throwaway ones it spawns.
    #
    # SECURITY NOTE: mounting the host docker socket gives this container
    # effective root-equivalent control over the host (it can create/control
    # any container, including ones that mount the host filesystem). This is
    # inherent to how the sandbox validation feature works. Worth revisiting
    # (rootless Docker-in-Docker, gVisor, or a dedicated validation host)
    # before this is treated as fully hardened for an internet-facing service.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:6001:6001"   # bound to localhost — Apache reverse-proxies from here

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: asf-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:6000:3000"   # bound to localhost — Apache reverse-proxies from here
    depends_on:
      - backend
